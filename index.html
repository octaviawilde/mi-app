<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mi-app_</title>
  <link rel="stylesheet" href="style.css">

  <!-- Home-screen app: name, icon and colours -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="mi-app">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a08">
</head>
<body>
  <!-- The text you see is Spanish; data-hint holds the small English hint shown under it -->
  <main>
    <div class="top">
      <p class="prompt">&gt; hola<span id="name"></span><span class="cursor">_</span></p>
      <button id="nav-settings" class="gear" data-hint="settings">⚙</button>
    </div>

    <nav class="menu">
      <button id="nav-today" class="active" data-hint="today">hoy</button>
      <button id="nav-profe" data-hint="your teacher">profe</button>
      <button id="nav-review" data-hint="review">repasar</button>
      <button id="nav-progress" data-hint="progress">progreso</button>
    </nav>

    <p class="line" id="status" data-hint="loading cards">cargando tarjetas...</p>

    <div id="screen-today">
      <p id="greeting" class="greeting"></p>
      <ul id="tasks" class="tasks"></ul>
      <p id="plan-note" class="line"></p>
    </div>

    <div id="screen-review" class="hidden">
      <section id="card" class="card">
        <p id="box" class="box"></p>
        <p id="question" class="question"></p>
        <p id="answer" class="answer hidden"></p>
        <p id="tap-hint" class="tap-hint" data-hint="tap to see the answer">toca para girar</p>
      </section>

      <!-- Writing: see the English, type the Spanish (only for words you already recognise) -->
      <section id="writing-card" class="card hidden">
        <p id="writing-box" class="box"></p>
        <p class="tap-hint writing-label" data-hint="write it in Spanish">escríbelo en español</p>
        <p id="writing-question" class="question"></p>
        <input id="writing-input" class="text-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <p class="tap-hint tip" data-hint="hold a vowel for its accent: á é í ó ú ñ">mantén pulsada una vocal para el acento</p>
        <p id="result" class="result hidden"></p>
        <p id="solution" class="answer hidden"></p>
      </section>

      <div id="writing-buttons" class="buttons hidden">
        <button id="writing-action" data-hint="check">comprobar</button>
      </div>
      <button id="count-correct" class="link hidden" data-hint="the app was too strict? count it as correct">✓ contar como bien</button>

      <!-- How do you feel about this word? 4 simple answers, from "no idea" to "easy" -->
      <div id="answers" class="answers hidden">
        <button data-level="0" data-hint="I don't know it">no la sé</button>
        <button data-level="1" data-hint="rings a bell">me suena</button>
        <button data-level="2" data-hint="I know it">la sé</button>
        <button data-level="3" data-hint="easy">¡fácil!</button>
      </div>

      <div id="more" class="buttons hidden">
        <button id="more-new" data-hint="5 more new words">[ + 5 nuevas ]</button>
        <button id="free-practice" data-hint="free practice">[ práctica libre ]</button>
      </div>
    </div>

    <!-- ⚙ Settings: you and the app (not your learning, that's in "progreso") -->
    <div id="screen-settings" class="hidden">
      <!-- Your profile: what Profe knows about you -->
      <h2 class="heading" data-hint="your profile: what Profe knows about you">tu ficha</h2>
      <div id="profile" class="profile"></div>

      <!-- Profe's AI: your provider + your own API key (it never leaves this device, except to that provider) -->
      <h2 class="heading" data-hint="the AI that powers Profe">la IA de Profe</h2>
      <div id="ai-settings" class="ai-settings">
        <label for="ai-provider" data-hint="provider">proveedor</label>
        <select id="ai-provider" class="text-input"></select>
        <label for="ai-key" data-hint="your API key">tu clave API</label>
        <input id="ai-key" class="text-input" type="password" autocomplete="off" spellcheck="false">
        <label for="ai-model" data-hint="model: the list comes from your key">modelo</label>
        <select id="ai-model" class="text-input"></select>
        <input id="ai-model-other" class="text-input hidden" type="text" placeholder="nombre del modelo"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="ai-find-models" class="link" data-hint="look up the models your key can use">↻ ver mis modelos</button>
        <div id="ai-url-row" class="hidden">
          <label for="ai-url" data-hint="the provider's address">dirección (URL)</label>
          <input id="ai-url" class="text-input" type="url" placeholder="https://…/v1" autocapitalize="off">
        </div>
        <p id="ai-status" class="caption"></p>
        <div class="buttons">
          <button id="ai-save" data-hint="save and test">guardar y probar</button>
          <button id="ai-forget" data-hint="delete the key">borrar</button>
        </div>
        <p class="caption" data-hint="your key only lives on this phone and is never in backups">🔒 tu clave solo vive en este teléfono</p>
      </div>

      <!-- Your data: things you need only sometimes, so they live here, out of the way -->
      <h2 class="heading" data-hint="your data">tus datos</h2>
      <footer class="data-tools">
        <button id="export" data-hint="save a backup">[ exportar ]</button>
        <label for="file" data-hint="load a file">[ importar ]</label>
        <input type="file" id="file" accept=".json,application/json" class="hidden">
      </footer>

      <p class="version">
        <button id="update" data-hint="check for updates">↻ actualizar</button>
        <span id="version"></span>
      </p>
    </div>

    <!-- Profe's chat with AI: send a sentence from your life, ask anything -->
    <div id="screen-profe" class="hidden">
      <div id="talk" class="chat"></div>
      <div class="chat-compose">
        <input id="talk-input" class="text-input" type="text" autocomplete="off" autocorrect="off"
               spellcheck="false" enterkeyhint="send" placeholder="escribe a Profe…">
        <button id="talk-send" data-hint="send">→</button>
      </div>
      <button id="talk-new" class="link" data-hint="new conversation (Profe keeps its notes about you)">↺ nueva conversación</button>
    </div>

    <!-- The first meeting with Profe: the interview -->
    <div id="screen-interview" class="hidden">
      <div id="chat" class="chat"></div>
      <div id="chat-compose" class="chat-compose hidden">
        <input id="chat-input" class="text-input" type="text" autocomplete="off" autocorrect="off"
               spellcheck="false" enterkeyhint="send">
        <button id="chat-send" data-hint="send">→</button>
      </div>
      <div id="choices" class="choices"></div>
    </div>

    <div id="screen-progress" class="hidden">
      <div id="report" class="report"></div>

      <!-- Your map: where you are on the CEFR levels (A1 → C2) -->
      <h2 class="heading" data-hint="your map: the levels from beginner (A1) to mastery (C2)">tu mapa</h2>
      <div id="map" class="map"></div>

    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
