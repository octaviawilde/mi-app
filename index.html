<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mi-app_</title>
  <link rel="stylesheet" href="style.css">

  <!-- Home-screen app: name, icon and colours -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="mi-app">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a08">
</head>
<body>
  <main>
    <p class="prompt">&gt; hola<span id="nombre"></span><span class="cursor">_</span></p>

    <nav class="menu">
      <button id="ver-hoy" class="activo" data-pista="today">[ hoy ]</button>
      <button id="ver-repaso" data-pista="review">[ repasar ]</button>
      <button id="ver-progreso" data-pista="progress">[ progreso ]</button>
    </nav>

    <p class="line" id="estado" data-pista="loading cards">cargando tarjetas...</p>

    <div id="pantalla-hoy">
      <p id="saludo" class="saludo"></p>
      <ul id="tareas" class="tareas"></ul>
      <p id="nota-plan" class="line"></p>
    </div>

    <div id="pantalla-repaso" class="oculta">
      <section id="tarjeta" class="tarjeta">
        <p id="caja" class="caja"></p>
        <p id="pregunta" class="pregunta"></p>
        <p id="respuesta" class="respuesta oculta"></p>
        <p id="toca" class="toca" data-pista="tap to see the answer">toca para girar</p>
      </section>

      <!-- Writing: see the English, type the Spanish (only for words you already recognise) -->
      <section id="tarjeta-escribir" class="tarjeta oculta">
        <p id="caja-escribir" class="caja"></p>
        <p class="toca etiqueta-escribir" data-pista="write it in Spanish">escríbelo en español</p>
        <p id="pregunta-escribir" class="pregunta"></p>
        <input id="entrada" class="entrada" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <p class="toca consejo" data-pista="hold a vowel for its accent: á é í ó ú ñ">mantén pulsada una vocal para el acento</p>
        <p id="resultado" class="resultado oculta"></p>
        <p id="solucion" class="respuesta oculta"></p>
      </section>

      <div id="botones-escribir" class="botones oculta">
        <button id="accion-escribir" data-pista="check">comprobar</button>
      </div>
      <button id="contar-bien" class="enlace oculta" data-pista="the app was too strict? count it as correct">✓ contar como bien</button>

      <!-- How do you feel about this word? 4 simple answers, from "no idea" to "easy" -->
      <div id="respuestas" class="respuestas oculta">
        <button data-nivel="0" data-pista="I don't know it">no la sé</button>
        <button data-nivel="1" data-pista="rings a bell">me suena</button>
        <button data-nivel="2" data-pista="I know it">la sé</button>
        <button data-nivel="3" data-pista="easy">¡fácil!</button>
      </div>

      <div id="extra" class="botones oculta">
        <button id="mas-nuevas" data-pista="5 more new words">[ + 5 nuevas ]</button>
        <button id="libre" data-pista="free practice">[ práctica libre ]</button>
      </div>
    </div>

    <!-- NEW: Profe's chat (first: the interview to meet you) -->
    <div id="pantalla-profe" class="oculta">
      <div id="chat" class="chat"></div>
      <div id="opciones" class="opciones"></div>
      <div id="chat-escribir" class="chat-escribir oculta">
        <input id="chat-entrada" class="entrada" type="text" autocomplete="off" autocorrect="off"
               spellcheck="false" enterkeyhint="send">
        <button id="chat-enviar" data-pista="send">→</button>
      </div>
    </div>

    <div id="pantalla-progreso" class="oculta">
      <div id="informe" class="informe"></div>

      <!-- NEW: your ficha: what Profe knows about you -->
      <h2 class="titulo" data-pista="your profile: what Profe knows about you">tu ficha</h2>
      <div id="ficha" class="ficha"></div>

      <!-- Your data: things you need only sometimes, so they live here, out of the way -->
      <h2 class="titulo" data-pista="your data">tus datos</h2>
      <footer class="pie">
        <button id="exportar" data-pista="save a backup">[ exportar ]</button>
        <label for="archivo" data-pista="load a file">[ importar ]</label>
        <input type="file" id="archivo" accept=".json,application/json" class="oculta">
      </footer>

      <p class="version">
        <button id="actualizar" data-pista="check for updates">↻ actualizar</button>
        <span id="version"></span>
      </p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
