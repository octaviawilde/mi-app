<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mi-app_</title>
  <link rel="stylesheet" href="style.css">

  <!-- Home-screen app: name, icon and colours -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="mi-app">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a08">
</head>
<body>
  <main>
    <p class="prompt">&gt; hola<span id="nombre"></span><span class="cursor">_</span></p>

    <nav class="menu">
      <button id="ver-hoy" class="activo" data-pista="today">[ hoy ]</button>
      <button id="ver-repaso" data-pista="review">[ repasar ]</button>
      <button id="ver-progreso" data-pista="progress">[ progreso ]</button>
    </nav>

    <p class="line" id="estado" data-pista="loading cards">cargando tarjetas...</p>

    <div id="pantalla-hoy">
      <p id="saludo" class="saludo"></p>
      <ul id="tareas" class="tareas"></ul>
      <p id="nota-plan" class="line"></p>
    </div>

    <div id="pantalla-repaso" class="oculta">
      <section class="tarjeta">
        <p id="pregunta" class="pregunta"></p>
        <p id="respuesta" class="respuesta oculta"></p>
      </section>

      <div class="botones">
        <button id="girar" data-pista="flip">[ girar ]</button>
        <button id="mal" class="oculta" data-pista="again">[ ✗ otra vez ]</button>
        <button id="bien" class="oculta" data-pista="I know it">[ ✓ la sé ]</button>
      </div>

      <div id="extra" class="botones oculta">
        <button id="mas-nuevas" data-pista="5 more new words">[ + 5 nuevas ]</button>
        <button id="libre" data-pista="free practice">[ práctica libre ]</button>
      </div>
    </div>

    <div id="pantalla-progreso" class="oculta">
      <div id="informe" class="informe"></div>
    </div>

    <footer class="pie">
      <button id="exportar" data-pista="save a backup">[ exportar ]</button>
      <label for="archivo" data-pista="load a file">[ importar ]</label>
      <input type="file" id="archivo" accept=".json,application/json" class="oculta">
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
