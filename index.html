<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mi-app_</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="prompt">&gt; hola, Octavia<span class="cursor">_</span></p>

    <nav class="menu">
      <button id="ver-repaso" class="activo">[ repasar ]</button>
      <button id="ver-progreso">[ progreso ]</button>
    </nav>

    <p class="line" id="estado">cargando tarjetas...</p>

    <div id="pantalla-repaso">
      <section class="tarjeta">
        <p id="pregunta" class="pregunta"></p>
        <p id="respuesta" class="respuesta oculta"></p>
      </section>

      <div class="botones">
        <button id="girar">[ girar ]</button>
        <button id="mal" class="oculta">[ ✗ otra vez ]</button>
        <button id="bien" class="oculta">[ ✓ la sé ]</button>
      </div>
    </div>

    <div id="pantalla-progreso" class="oculta">
      <pre id="informe" class="informe"></pre>
    </div>

    <footer class="pie">
      <button id="exportar">[ exportar ]</button>
      <label for="archivo">[ importar ]</label>
      <input type="file" id="archivo" accept=".json,application/json" class="oculta">
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
